<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <style>
      header {
        background-color: #ec7cf6;
        color: white;
        padding: 20px;
        text-align: center;
      }
    </style>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Contacto</h1>
    </header>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="museos.html">Museos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <div class="content">
      <section>
        <h2>Envíanos un mensaje</h2>
        <img
          src="img/centro_cultura.jpg"
          alt="centro_cultura"
          style="
            display: block;
            margin: 0 auto;
            width: 80%;
            border-radius: 15px;
          "
        />
        <form action="#" method="post">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" required />

          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" required />

          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" required></textarea>

          <button type="submit">Enviar</button>
        </form>
      </section>
      <aside>
        <h3>Contacto adicional</h3>
        <p>
          Puedes ponerte en contacto con nosotros por teléfono o bien correo
          electrónico. culturadejujuy@gmail.com
        </p>
      </aside>
    </div>
    <footer
      style="
        background-color: #333;
        color: white;
        text-align: center;
        padding: 10px;
        position: fixed;
        width: 100%;
        bottom: 0;
      "
    >
      <address>
        <p>
          Correo:
          <a
            href="mailto:culturadejujuy@gmail.com"
            style="color: #10045f; text-decoration: none; font-size: 18px"
            >culturadejujuy@gmail.com</a
          >
        </p>
        <p>
          Tel:
          <a
            href="tel:+080012312"
            style="color: #10045f; text-decoration: none; font-size: 18px"
            >080012312</a
          >
        </p>
      </address>
    </footer>
  </body>
</html>
